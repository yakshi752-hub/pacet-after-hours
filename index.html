<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // PACET After Hours — Supabase connection
  const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
  const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("confessionForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const category = document.getElementById("category").value;
    const confession = document
      .getElementById("confession").value.trim();
    const publishTo = document.getElementById("publication").value;
    const consent = document.getElementById("consent").checked;

    if (!consent) {
      message.textContent =
        "Please confirm that your submission is appropriate.";
      return;
    }

    if (!confession) {
      message.textContent = "Please write your confession first.";
      return;
    }

    const submitButton = form.querySelector(
      'button[type="submit"]'
    );

    if (submitButton) submitButton.disabled = true;
    message.textContent = "Submitting your confession...";

    try {
      const { error } = await supabaseClient
        .from("confessions")
        .insert({
          category: category,
          confession: confession,
          publish_to: publishTo,
          status: "pending"
        });

      if (error) throw error;

      message.textContent =
        "Thank you! Your confession has been submitted for review.";

      form.reset();
    } catch (error) {
      console.error("Submission error:", error);
      message.textContent =
        "Sorry, submission failed. Please try again later.";
    } finally {
      if (submitButton) submitButton.disabled = false;
    }
  });
</script>
